name: Elpris - Daglig opdatering

on:
  schedule:
    - cron: '0 12 * * *'  # Kl. 14 dansk tid (UTC+2)
  workflow_dispatch:

jobs:
  run-elpris:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Setup Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run elpris script
        run: python main.py

      - name: Send email notification
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python3 -c "
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          # Læs resultatet
          with open('result_20261005.txt', 'r') as f:
              result = f.read()

          # Opret email
          msg = MIMEMultipart()
          msg['From'] = '$EMAIL_USER'
          msg['To'] = '$EMAIL_TO'
          msg['Subject'] = 'Elpris - Billigste timer i morgen'
          msg.attach(MIMEText(result, 'plain', 'utf-8'))

          # Send email
          with smtplib.SMTP('$SMTP_SERVER', $SMTP_PORT) as server:
              server.starttls()
              server.login('$EMAIL_USER', '$EMAIL_PASSWORD')
              server.send_message(msg)
          print('Email sendt succesfuldt!')
          "

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elpris-result
          path: result_*.txt
