name: Elpris - Daglig opdatering

on:
  schedule:
    - cron: '0 12 * * *'  # Kl. 14 dansk tid (UTC+2)
  workflow_dispatch:

jobs:
  run-elpris:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Setup Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run elpris script
        run: python main.py

      - name: Send email notification
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python send_email.py "$SMTP_SERVER" "$SMTP_PORT" "$EMAIL_USER" "$EMAIL_PASSWORD" "$EMAIL_TO"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()  # Upload selv om tidligere steps fejler
        with:
          name: elpris-results
          path: |
            result_*.txt
            email_error.txt
